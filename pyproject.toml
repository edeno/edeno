[project]
name = "edenovellis-site"
version = "0.0.0"
description = "Personal academic website (Sphinx + MyST)"
requires-python = ">=3.13"
dependencies = [
    "docutils",
    "myst-parser",
    "furo",
    "sphinx",
    "sphinx-design",
    "sphinxext-opengraph",
    "sphinx-sitemap",
    "requests",
    "sphinx-notfound-page>=1.1.0",
]

[dependency-groups]
test = ["pytest"]
dev = [{ include-group = "test" }, "sphinx-autobuild"]

[tool.pytest.ini_options]
testpaths = ["tests"]
