[project]
name = "edenovellis-site"
version = "0.0.0"
description = "Personal academic website (Sphinx + MyST)"
requires-python = ">=3.13"
dependencies = [
    "docutils",
    "myst-nb",
    "myst-parser",
    "furo",
    "rich",
    "sphinx",
    "sphinx-autobuild",
    "sphinx-design",
    "sphinxext-opengraph",
    "sphinx-sitemap",
    "requests",
]

[dependency-groups]
# Only needed if a page executes a notebook.
execute = [
    "colorspacious",
    "ipywidgets",
    "jupyterlab",
    "jupytext",
    "makeitpop",
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
    "seaborn",
    "xarray",
]
