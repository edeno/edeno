name: deploy-website

# Build on every PR, every push to main, and weekly (Mondays 13:00 UTC) so
# the publications page picks up new ORCID entries even without a code push.
# Only the push-to-main + cron paths actually publish (see the gating `if:`
# on the gh-pages step below).
on:
  pull_request:
  push:
    branches:
    - main
  schedule:
    - cron: '0 13 * * 1'

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # Python version comes from .python-version; dependencies from uv.lock.
    - uses: astral-sh/setup-uv@v10.3.3

    - name: Install dependencies
      run: |
        uv sync --locked --group execute
        uv run python scripts/orcid-publications.py
    # Build the book
    - name: Build the site
      run: |
        uv run make dirhtml
    # If we've pushed to main, push the book's HTML to github-pages
    - if: ${{ github.ref == 'refs/heads/main' }}
      name: GitHub Pages action
      uses: peaceiris/actions-gh-pages@v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./_build/dirhtml
        cname: www.edenovellis.com
