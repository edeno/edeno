name: deploy-website

# Build on every PR, every push to main, and weekly (Mondays 13:00 UTC) so
# the publications page picks up new ORCID entries even without a code push.
# Only the push-to-main + cron paths actually publish (see the `if:` on the
# upload step and the deploy job).
on:
  pull_request:
  push:
    branches:
    - main
  schedule:
    - cron: '0 13 * * 1'

permissions:
  contents: read

# One run per ref at a time. Superseded PR builds are cancelled; deploys
# from main queue instead so a publish is never interrupted midway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # Python version comes from .python-version; dependencies from uv.lock.
    - uses: astral-sh/setup-uv@v10.3.3

    - name: Install dependencies
      run: |
        uv sync --locked --group execute
        uv run python scripts/orcid-publications.py
    # Warnings fail PR builds only. Deploys (CV pushes, weekly ORCID refresh)
    # include content we don't control, so they log warnings but still publish.
    - name: Build the site
      env:
        SPHINXOPTS: ${{ github.event_name == 'pull_request' && '-nW --keep-going' || '-n' }}
      run: |
        uv run make dirhtml

    - if: ${{ github.ref == 'refs/heads/main' }}
      uses: actions/upload-pages-artifact@v5.0.0
      with:
        path: ./_build/dirhtml

  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v5.0.1
