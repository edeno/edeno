name: deploy-website

# Build on every PR, every push to main, and weekly (Mondays 13:00 UTC) so
# the publications page picks up new ORCID entries even without a code push.
# Only the push-to-main + cron paths actually publish (see the gating `if:`
# on the gh-pages step below).
on:
  pull_request:
  push:
    branches:
    - main
  schedule:
    - cron: '0 13 * * 1'

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # Install dependencies
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install -r execute-requirements.txt
        python scripts/orcid-publications.py
    # Build the book
    - name: Build the site
      run: |
        make dirhtml
    # If we've pushed to main, push the book's HTML to github-pages
    - if: ${{ github.ref == 'refs/heads/main' }}
      name: GitHub Pages action
      uses: peaceiris/actions-gh-pages@v3.9.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./_build/dirhtml
        cname: www.edenovellis.com
